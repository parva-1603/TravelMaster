name: travelmaster
description: A premium travel planner application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.2.0
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.1.0
  google_fonts: ^6.1.0
  glassmorphism: ^3.0.0
  provider: ^6.1.1
  flutter_animate: ^4.2.0
  google_sign_in: ^6.2.2
  http: ^1.2.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  supabase_flutter: ^2.6.0
  google_generative_ai: ^0.4.6
  flutter_markdown: ^0.7.7+1
  url_launcher: ^6.3.3
  markdown: ^7.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
